<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="container">
      <form>
        <div>
          <label>First Name:</label>
          <input type="text" class="form-input" id="firstName" value="Mario" />
        </div>
        <div>
          <label>Last Name:</label>
          <input type="text" class="form-input" id="lastName" value="Rossi" />
        </div>
        <div>
          <label>Age:</label>
          <input type="number" class="form-input" id="age" value="25" />
        </div>
      </form>
    </div>

    <script>
      const inputs = document.querySelectorAll(".form-input");
      console.log(inputs);
      const person = {
        firstName: inputs[0].value,
        lastName: inputs[1].value,
        age: inputs[2].value,
      };
      console.log(person);
      const form = document.querySelector("form");
      form.setAttribute("data-person", JSON.stringify(person));
      console.log(form.getAttribute("data-person"));
    </script>
  </body>
</html>
