<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Accedi - Develhope</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../styles/login.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script type="module" src="../scripts/login.js"></script>
        <style>
            * {
                box-sizing: border-box;
                font-family: 'Poppins', sans-serif;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background-color: #4F4FCC;
                display: flex;
                flex-direction: column;
            }

            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 40px;
            }

            .top-bar img {
                filter: brightness(0) invert(1);
            }

            .lang-selector {
                background-color: #3A3AA8;
                color: white;
                border: none;
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
            }

            .login-card {
                background-color: white;
                width: 400px;
                max-width: 90%;
                margin: 40px auto;
                padding: 40px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            }

            .login-card h1 {
                margin: 0 0 24px;
                color: #283681;
                font-size: 28px;
            }

            .google-btn {
                width: 100%;
                padding: 12px;
                background-color: white;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 500;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }

            .google-btn:hover {
                background-color: #f5f5f5;
            }

            .divider {
                text-align: center;
                color: #888;
                margin: 16px 0;
                font-size: 14px;
            }

            label {
                display: block;
                margin-bottom: 6px;
                color: #333;
                font-size: 14px;
            }

            input[type=email],
            input[type=password] {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
                margin-bottom: 16px;
            }

            input[type=email]:focus,
            input[type=password]:focus {
                outline: none;
                border-color: #4F4FCC;
            }

            .forgot-password {
                display: block;
                color: #4F4FCC;
                text-decoration: underline;
                font-size: 13px;
                margin-bottom: 20px;
            }

            .submit-btn {
                width: 100%;
                padding: 12px;
                background-color: #ccc;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 600;
                cursor: not-allowed;
            }

            .submit-btn:enabled {
                background-color: #283681;
                cursor: pointer;
            }

            .signup-link {
                display: block;
                text-align: center;
                margin-top: 16px;
                font-size: 14px;
                color: #333;
            }

            .signup-link a {
                color: #4F4FCC;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="top-bar">
            <img src="../images/develhope.png" alt="Logo Develhope" width="160">
        </div>

        <div class="login-card">

            <button class="google-btn">
                <img src="https://www.google.com/favicon.ico" alt="Google" width="18">
                Continua con Google
            </button>

            <p class="divider">oppure</p>

            <form>
                <label for="email">Email</label>
                <input id="email" name="email" type="email">

                <label for="password">Password</label>
                <input id="password" name="password" type="password">

                <a href="#" class="forgot-password">Hai dimenticato la password?</a>

                <button type="button" class="submit-btn" disabled>Accedi</button>
            </form>

            <span class="signup-link">
                Non sei registrato? <a href="https://www.develhope.co/sign-up">Candidati ora</a>
            </span>
        </div>
    </body>
</html>
